<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido a Zapas Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Zapas Store</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/carrito}">Carrito</a>
                </li>

                <!-- Si el usuario está autenticado -->
                <li class="nav-item dropdown" th:if="${#authentication.authenticated}">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" role="button">
                        <span th:text="${#authentication.name}">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/micuenta}">Mi cuenta</a></li>
                        <li><a class="dropdown-item" th:href="@{/logout}">Cerrar sesión</a></li>
                    </ul>
                </li>

                <!-- Si el usuario NO está autenticado -->
                <li class="nav-item" th:if="${not #authentication.authenticated}">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<section class="container text-center mt-5">
    <h1>Bienvenido a Zapas Store</h1>
    <p>Encuentra las mejores zapatillas Nike con descuentos exclusivos 🏷️</p>
    <a class="btn btn-primary btn-lg mt-3" th:href="@{/productos}">Ver Catálogo</a>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
